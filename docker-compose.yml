version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transaction_risk}
      POSTGRES_USER: ${POSTGRES_USER:-transaction_risk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transaction_risk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trp-redis
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: trp-gateway
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion_service/Dockerfile
    container_name: trp-ingestion-service
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8001"

  risk-service:
    build:
      context: .
      dockerfile: services/risk_service/Dockerfile
    container_name: trp-risk-service
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8002:8002"

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics_service/Dockerfile
    container_name: trp-analytics-service
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8003:8003"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: trp-worker
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8004:8004"

volumes:
  postgres_data:

